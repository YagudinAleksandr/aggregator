name: coffeemock-backend

on:
  push:
    branches: [master, dev]
    paths:
      - 'coffeemock/backend/**'
      - '.github/workflows/coffeemock-backend.yml'
  workflow_dispatch:

concurrency:
  group: coffeemock-backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: coffeemock/backend

jobs:
  # Тесты: dev и master
  test:
    name: Test
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read    # для скачивания shared-kernel из GitHub Packages
    steps:
      - uses: actions/checkout@v5

      # setup-java создаёт settings.xml с сервером "github" (id совпадает с <repository> в pom)
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: coffeemock/backend/**/pom.xml
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn -B -ntp clean test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: coffeemock/backend/**/target/surefire-reports/

  # Сборка: только master и только после успешных тестов
  build:
    name: Build
    needs: test
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read    # для скачивания shared-kernel из GitHub Packages
    outputs:
      version: ${{ steps.pom.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      # setup-java создаёт settings.xml с сервером "github" (id совпадает с <repository> в pom)
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: coffeemock/backend/**/pom.xml
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      # Тесты уже прошли в задаче test
      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn -B -ntp clean package -DskipTests

      - name: Read version from pom.xml
        id: pom
        run: echo "version=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: coffeemock-jar
          path: coffeemock/backend/coffeemock-adapters/target/coffeemock.jar

  docker:
    name: Docker image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # чтение shared-kernel и публикация образа в ghcr.io
    steps:
      - uses: actions/checkout@v5

      # Dockerfile ждёт settings.xml как build secret "maven_settings".
      # Токен пишется во временный файл раннера и в образ не попадает.
      - name: Create Maven settings for Docker build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > "$RUNNER_TEMP/maven-settings.xml" <<EOF
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${GITHUB_ACTOR}</username>
                <password>${GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Теги: версия из pom.xml, короткий sha коммита и latest
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/coffeemock-backend
          tags: |
            type=raw,value=${{ needs.build.outputs.version }}
            type=sha,format=short
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: coffeemock/backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secret-files: |
            maven_settings=${{ runner.temp }}/maven-settings.xml
          cache-from: type=gha
          cache-to: type=gha,mode=max
